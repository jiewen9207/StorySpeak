<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>故事列表 - StorySpeak English</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="header">
    <div class="header-content">
      <a href="/stories.html" class="logo">StorySpeak</a>
      <nav class="nav">
        <a href="/stories.html" class="active">故事库</a>
        <a href="/favorites.html">收藏夹</a>
        <a href="/profile.html">个人中心</a>
        <a href="/admin.html" id="adminLink" style="display:none;">⚙️ 管理后台</a>
        <a href="#" id="logoutBtn">退出</a>
      </nav>
    </div>
  </header>

  <div class="container">
    <div id="profileInfo" class="card" style="margin-top: 24px; display: none;"></div>

    <div class="filter-bar" style="margin-top: 24px;">
      <select id="difficultyFilter">
        <option value="">全部难度</option>
        <option value="easy">简单</option>
        <option value="medium">中等</option>
        <option value="hard">困难</option>
      </select>
      <select id="categoryFilter">
        <option value="">全部类型</option>
        <option value="daily">日常生活</option>
        <option value="travel">旅行</option>
        <option value="business">商务</option>
        <option value="social">社交</option>
        <option value="academic">学术</option>
      </select>
      <input type="text" id="searchInput" placeholder="搜索故事..." style="flex: 1; min-width: 200px;">
    </div>

    <div id="codeRedeemSection" class="card" style="margin-top: 24px; display: none;">
      <h3 style="margin-bottom: 16px;">🔑 激活账户</h3>
      <p style="color: #888; margin-bottom: 16px;">请输入从小红书店铺购买的兑换码来激活您的账户</p>
      <div style="display: flex; gap: 12px; flex-wrap: wrap;">
        <input type="text" id="codeInput" placeholder="请输入兑换码" style="flex: 1; min-width: 200px; padding: 12px 16px; border: 2px solid #e0e4e8; border-radius: 8px; font-size: 15px; letter-spacing: 2px;">
        <button id="redeemBtn" class="btn btn-primary">激活兑换码</button>
      </div>
    </div>

    <div id="storyGrid" class="story-grid"></div>
    <div id="emptyState" class="empty-state" style="display: none;">
      <div class="empty-state-icon">📚</div>
      <div>暂无故事</div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    let allStories = [];

    async function init() {
      if (!checkAuth()) return;

      document.getElementById('logoutBtn').addEventListener('click', (e) => {
        e.preventDefault();
        logout();
      });

      try {
        const user = await api('/api/user/profile');
        if (user.is_admin) {
          document.getElementById('adminLink').style.display = 'inline';
        }
        if (!user.is_active && !user.is_admin) {
          document.getElementById('codeRedeemSection').style.display = 'block';
        }
        displayProfile(user);
        loadStories();
      } catch (err) {
        showMessage(err.message, 'error');
      }
    }

    function displayProfile(user) {
      const el = document.getElementById('profileInfo');
      el.style.display = 'block';
      el.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
          <div>
            <h2>欢迎, ${user.username} 👋</h2>
            <p style="color: #888;">${user.is_active ? '✓ 已激活' : '⚠️ 未激活'}</p>
          </div>
          <div style="display: flex; gap: 24px; flex-wrap: wrap;">
            <div class="stat-item"><strong>${user.stats.totalStories}</strong> 学习故事</div>
            <div class="stat-item"><strong>${user.stats.completedStories}</strong> 完成</div>
            <div class="stat-item"><strong>${Math.floor(user.stats.totalTime / 60)}</strong> 分钟学习</div>
            <div class="stat-item"><strong>${user.stats.favorites}</strong> 收藏</div>
          </div>
        </div>
      `;
    }

    async function loadStories() {
      try {
        allStories = await api('/api/stories');
        renderStories(allStories);
      } catch (err) {
        if (err.message && err.message.includes('未激活')) {
          document.getElementById('storyGrid').style.display = 'none';
          document.getElementById('emptyState').style.display = 'block';
          document.getElementById('emptyState').innerHTML = '<div class="empty-state-icon">🔒</div><div>请先激活账户以查看故事</div>';
        } else {
          showMessage(err.message, 'error');
        }
      }
    }

    function renderStories(stories) {
      const grid = document.getElementById('storyGrid');
      const empty = document.getElementById('emptyState');
      
      if (stories.length === 0) {
        grid.style.display = 'none';
        empty.style.display = 'block';
        return;
      }
      
      empty.style.display = 'none';
      grid.style.display = 'grid';
      
      grid.innerHTML = stories.map(s => {
        const difficultyText = { easy: '简单', medium: '中等', hard: '困难' }[s.difficulty] || s.difficulty;
        const categoryText = { daily: '日常生活', travel: '旅行', business: '商务', social: '社交', academic: '学术' }[s.category] || s.category;
        return `
          <a href="/story.html?id=${s.id}" class="story-card">
            <div class="story-cover" style="background: linear-gradient(135deg, var(--color1, #667eea), var(--color2, #764ba2));">
              <span>${getEmoji(s.category)}</span>
            </div>
            <div class="story-info">
              <div class="story-title">${s.title}</div>
              <div class="story-meta">
                <span class="badge badge-${s.difficulty}">${difficultyText}</span>
                <span class="badge badge-category">${categoryText}</span>
                ${s.is_favorite ? '<span class="badge" style="background:#ffe0e0;color:#ff4757;">♥ 收藏</span>' : ''}
              </div>
              <div class="story-progress">
                <div class="progress-bar" style="width: ${s.is_completed ? 100 : 0}%"></div>
              </div>
            </div>
          </a>
        `;
      }).join('');
    }

    function getEmoji(category) {
      const map = {
        daily: '🏠',
        travel: '✈️',
        business: '💼',
        social: '👥',
        academic: '📖'
      };
      return map[category] || '📚';
    }

    document.getElementById('difficultyFilter').addEventListener('change', applyFilters);
    document.getElementById('categoryFilter').addEventListener('change', applyFilters);
    document.getElementById('searchInput').addEventListener('input', applyFilters);

    function applyFilters() {
      const difficulty = document.getElementById('difficultyFilter').value;
      const category = document.getElementById('categoryFilter').value;
      const search = document.getElementById('searchInput').value.toLowerCase();
      
      let filtered = allStories;
      if (difficulty) filtered = filtered.filter(s => s.difficulty === difficulty);
      if (category) filtered = filtered.filter(s => s.category === category);
      if (search) filtered = filtered.filter(s => 
        s.title.toLowerCase().includes(search) || 
        (s.title_cn && s.title_cn.toLowerCase().includes(search))
      );
      
      renderStories(filtered);
    }

    document.getElementById('redeemBtn').addEventListener('click', async () => {
      const code = document.getElementById('codeInput').value.trim();
      if (!code) {
        showMessage('请输入兑换码', 'error');
        return;
      }
      try {
        await api('/api/redeem', {
          method: 'POST',
          body: { code }
        });
        showMessage('兑换码激活成功！', 'success');
        setTimeout(() => {
          window.location.reload();
        }, 1000);
      } catch (err) {
        showMessage(err.message, 'error');
      }
    });

    init();
  </script>
</body>
</html>
