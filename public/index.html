<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StorySpeak English - 故事英语口语学习平台</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">StorySpeak</div>
      <div class="auth-subtitle">通过故事，轻松说英语</div>
      
      <div class="auth-tabs">
        <div class="auth-tab active" data-tab="login">登录</div>
        <div class="auth-tab" data-tab="register">注册</div>
      </div>

      <form id="loginForm" class="auth-form active">
        <div class="form-group">
          <label>用户名/邮箱</label>
          <input type="text" id="loginInput" placeholder="请输入用户名或邮箱" required>
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="loginPassword" placeholder="请输入密码" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">登录</button>
        <div style="text-align: center; margin-top: 12px;">
          <a href="#" id="forgotPasswordLink" style="color: #667eea; font-size: 13px;">忘记密码？</a>
        </div>
      </form>

      <form id="registerForm" class="auth-form">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="regUsername" placeholder="请输入用户名" required>
        </div>
        <div class="form-group">
          <label>邮箱</label>
          <input type="email" id="regEmail" placeholder="请输入邮箱" required>
        </div>
        <div class="form-group">
          <label>密码 (至少6位)</label>
          <input type="password" id="regPassword" placeholder="请输入密码" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">注册账户</button>
        <div style="margin-top: 16px; font-size: 13px; color: #888; text-align: center;">
          注册后，请使用从小红书店铺购买的兑换码激活账户
        </div>
      </form>
    </div>
  </div>

  <!-- Forgot Password Modal -->
  <div id="forgotModal" class="modal" style="display: none;">
    <div class="modal-content" style="max-width: 400px;">
      <div class="modal-header">
        <h2>找回密码</h2>
        <button class="modal-close" onclick="closeForgotModal()">✕</button>
      </div>
      <div style="padding: 20px;">
        <div class="form-group">
          <label>邮箱地址</label>
          <input type="email" id="forgotEmail" placeholder="请输入注册时的邮箱" style="width: 100%; padding: 12px; border: 2px solid #e0e4e8; border-radius: 8px;">
        </div>
        <button id="sendCodeBtn" class="btn btn-primary" style="width: 100%;">发送验证码</button>
        
        <div id="resetSection" style="display: none; margin-top: 16px;">
          <div class="form-group">
            <label>验证码</label>
            <input type="text" id="resetCode" placeholder="请输入6位验证码" maxlength="6" style="width: 100%; padding: 12px; border: 2px solid #e0e4e8; border-radius: 8px;">
          </div>
          <div class="form-group">
            <label>新密码 (至少6位)</label>
            <input type="password" id="newPassword" placeholder="请输入新密码" minlength="6" style="width: 100%; padding: 12px; border: 2px solid #e0e4e8; border-radius: 8px;">
          </div>
          <button id="resetPasswordBtn" class="btn btn-primary" style="width: 100%;">重置密码</button>
        </div>
        <div id="forgotMessage" style="margin-top: 12px; text-align: center;"></div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const tabs = document.querySelectorAll('.auth-tab');
    const forms = {
      login: document.getElementById('loginForm'),
      register: document.getElementById('registerForm')
    };

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const type = tab.dataset.tab;
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        Object.values(forms).forEach(f => f.classList.remove('active'));
        forms[type].classList.add('active');
      });
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const login = document.getElementById('loginInput').value;
      const password = document.getElementById('loginPassword').value;
      
      try {
        const data = await api('/api/login', {
          method: 'POST',
          body: { login, password }
        });
        setToken(data.token);
        showMessage('登录成功！正在跳转...', 'success');
        setTimeout(() => {
          window.location.href = '/stories.html';
        }, 500);
      } catch (err) {
        showMessage(err.message, 'error');
      }
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('regUsername').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;
      
      try {
        await api('/api/register', {
          method: 'POST',
          body: { username, email, password }
        });
        showMessage('注册成功！请登录', 'success');
        setTimeout(() => {
          tabs[0].click();
        }, 1000);
      } catch (err) {
        showMessage(err.message, 'error');
      }
    });

    const token = getToken();
    if (token) {
      fetch('/api/user/profile', { headers: { 'Authorization': `Bearer ${token}` } })
        .then(r => r.ok ? r.json() : null)
        .then(user => {
          if (user) {
            window.location.href = '/stories.html';
          }
        })
        .catch(() => {});
    }

    // Forgot Password
    document.getElementById('forgotPasswordLink').addEventListener('click', (e) => {
      e.preventDefault();
      document.getElementById('forgotModal').style.display = 'flex';
    });

    function closeForgotModal() {
      document.getElementById('forgotModal').style.display = 'none';
      document.getElementById('forgotEmail').value = '';
      document.getElementById('resetCode').value = '';
      document.getElementById('newPassword').value = '';
      document.getElementById('resetSection').style.display = 'none';
      document.getElementById('forgotMessage').innerHTML = '';
    }

    document.getElementById('sendCodeBtn').addEventListener('click', async () => {
      const email = document.getElementById('forgotEmail').value.trim();
      if (!email) {
        document.getElementById('forgotMessage').innerHTML = '<span style="color: red;">请输入邮箱</span>';
        return;
      }
      
      document.getElementById('sendCodeBtn').textContent = '发送中...';
      document.getElementById('sendCodeBtn').disabled = true;
      
      try {
        const result = await api('/api/forgot-password', {
          method: 'POST',
          body: { email }
        });
        
        document.getElementById('forgotMessage').innerHTML = '<span style="color: green;">' + result.message + '</span>';
        document.getElementById('resetSection').style.display = 'block';
      } catch (err) {
        document.getElementById('forgotMessage').innerHTML = '<span style="color: red;">' + err.message + '</span>';
      }
      
      document.getElementById('sendCodeBtn').textContent = '发送验证码';
      document.getElementById('sendCodeBtn').disabled = false;
    });

    document.getElementById('resetPasswordBtn').addEventListener('click', async () => {
      const email = document.getElementById('forgotEmail').value.trim();
      const code = document.getElementById('resetCode').value.trim();
      const newPassword = document.getElementById('newPassword').value;
      
      if (!code || !newPassword) {
        document.getElementById('forgotMessage').innerHTML = '<span style="color: red;">请填写完整信息</span>';
        return;
      }
      
      try {
        await api('/api/reset-password', {
          method: 'POST',
          body: { email, code, newPassword }
        });
        
        document.getElementById('forgotMessage').innerHTML = '<span style="color: green;">密码重置成功！请使用新密码登录。</span>';
        setTimeout(closeForgotModal, 2000);
      } catch (err) {
        document.getElementById('forgotMessage').innerHTML = `<span style="color: red;">${err.message}</span>`;
      }
    });
  </script>
</body>
</html>
