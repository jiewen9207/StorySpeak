<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StorySpeak English - 故事英语口语学习平台</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">StorySpeak</div>
      <div class="auth-subtitle">通过故事，轻松说英语</div>
      
      <div class="auth-tabs">
        <div class="auth-tab active" data-tab="login">登录</div>
        <div class="auth-tab" data-tab="register">注册</div>
      </div>

      <form id="loginForm" class="auth-form active">
        <div class="form-group">
          <label>用户名/邮箱</label>
          <input type="text" id="loginInput" placeholder="请输入用户名或邮箱" required>
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="loginPassword" placeholder="请输入密码" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">登录</button>
      </form>

      <form id="registerForm" class="auth-form">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="regUsername" placeholder="请输入用户名" required>
        </div>
        <div class="form-group">
          <label>邮箱</label>
          <input type="email" id="regEmail" placeholder="请输入邮箱" required>
        </div>
        <div class="form-group">
          <label>密码 (至少6位)</label>
          <input type="password" id="regPassword" placeholder="请输入密码" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">注册账户</button>
        <div style="margin-top: 16px; font-size: 13px; color: #888; text-align: center;">
          注册后，请使用从小红书店铺购买的兑换码激活账户
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const tabs = document.querySelectorAll('.auth-tab');
    const forms = {
      login: document.getElementById('loginForm'),
      register: document.getElementById('registerForm')
    };

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const type = tab.dataset.tab;
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        Object.values(forms).forEach(f => f.classList.remove('active'));
        forms[type].classList.add('active');
      });
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const login = document.getElementById('loginInput').value;
      const password = document.getElementById('loginPassword').value;
      
      try {
        const data = await api('/api/login', {
          method: 'POST',
          body: { login, password }
        });
        setToken(data.token);
        showMessage('登录成功！正在跳转...', 'success');
        setTimeout(() => {
          window.location.href = '/stories.html';
        }, 500);
      } catch (err) {
        showMessage(err.message, 'error');
      }
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('regUsername').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;
      
      try {
        await api('/api/register', {
          method: 'POST',
          body: { username, email, password }
        });
        showMessage('注册成功！请登录', 'success');
        setTimeout(() => {
          tabs[0].click();
        }, 1000);
      } catch (err) {
        showMessage(err.message, 'error');
      }
    });

    const token = getToken();
    if (token) {
      fetch('/api/user/profile', { headers: { 'Authorization': `Bearer ${token}` } })
        .then(r => r.ok ? r.json() : null)
        .then(user => {
          if (user) {
            window.location.href = '/stories.html';
          }
        })
        .catch(() => {});
    }
  </script>
</body>
</html>
