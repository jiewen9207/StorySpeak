<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户管理 - StorySpeak</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
    .card { background: #f5f5f5; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background: #667eea; color: white; }
    .admin { background: #fff3cd; }
    .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; }
    .btn-primary { background: #667eea; color: white; }
    .btn-danger { background: #dc3545; color: white; }
    .message { padding: 10px; border-radius: 4px; margin-bottom: 20px; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <h1>👥 用户管理</h1>
  <div id="message"></div>
  
  <div class="card">
    <h2>设置管理员</h2>
    <p>输入管理员邮箱（必须是已注册的邮箱）：</p>
    <input type="email" id="adminEmail" placeholder="admin@example.com" style="width: 100%; padding: 10px; margin-bottom: 10px;">
    <button class="btn btn-primary" onclick="setAdmin()">设置为管理员</button>
  </div>
  
  <div class="card">
    <h2>当前用户列表</h2>
    <div id="userList">加载中...</div>
  </div>
  
  <script src="./js/supabase.js"></script>
  <script>
    function showMessage(msg, type) {
      document.getElementById('message').innerHTML = `<div class="message ${type}">${msg}</div>`;
    }
    
    function setAdmin() {
      const email = document.getElementById('adminEmail').value.toLowerCase().trim();
      if (!email) {
        showMessage('请输入邮箱', 'error');
        return;
      }
      
      const users = JSON.parse(localStorage.getItem('ss_users') || '[]');
      const user = users.find(u => u.email === email);
      
      if (!user) {
        showMessage('用户不存在', 'error');
        return;
      }
      
      user.is_admin = true;
      user.is_active = true;
      localStorage.setItem('ss_users', JSON.stringify(users));
      
      showMessage(`已将 ${email} 设置为管理员`, 'success');
      loadUsers();
    }
    
    function removeAdmin(email) {
      const users = JSON.parse(localStorage.getItem('ss_users') || '[]');
      const user = users.find(u => u.email === email);
      
      if (!user) {
        showMessage('用户不存在', 'error');
        return;
      }
      
      user.is_admin = false;
      localStorage.setItem('ss_users', JSON.stringify(users));
      
      showMessage(`已取消 ${email} 的管理员权限`, 'success');
      loadUsers();
    }
    
    function deleteUser(email) {
      if (!confirm(`确定要删除用户 ${email} 吗？`)) return;
      
      const users = JSON.parse(localStorage.getItem('ss_users') || '[]');
      const filtered = users.filter(u => u.email !== email);
      localStorage.setItem('ss_users', JSON.stringify(filtered));
      
      showMessage(`已删除用户 ${email}`, 'success');
      loadUsers();
    }
    
    function loadUsers() {
      const users = JSON.parse(localStorage.getItem('ss_users') || '[]');
      const container = document.getElementById('userList');
      
      if (users.length === 0) {
        container.innerHTML = '<p>暂无用户</p>';
        return;
      }
      
      // 按时间倒序排列
      users.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      
      container.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>用户名</th>
              <th>邮箱</th>
              <th>状态</th>
              <th>注册时间</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody>
            ${users.map(u => `
              <tr class="${u.is_admin ? 'admin' : ''}">
                <td>${u.username || '-'}</td>
                <td>${u.email}</td>
                <td>
                  ${u.is_admin ? '👑 管理员' : ''}
                  ${u.is_active ? '✓ 已激活' : '⚠️ 未激活'}
                </td>
                <td>${u.created_at ? new Date(u.created_at).toLocaleDateString() : '-'}</td>
                <td>
                  ${u.is_admin 
                    ? `<button class="btn btn-danger" onclick="removeAdmin('${u.email}')">取消管理员</button>`
                    : `<button class="btn btn-primary" onclick="setAdminFromList('${u.email}')">设为管理员</button>`
                  }
                  <button class="btn btn-danger" onclick="deleteUser('${u.email}')">删除</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }
    
    function setAdminFromList(email) {
      document.getElementById('adminEmail').value = email;
      setAdmin();
    }
    
    // 页面加载时显示用户列表
    loadUsers();
  </script>
</body>
</html>
